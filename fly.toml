app = "provedores"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOCAL_DB_PATH = "/data/app.db"

[mounts]
  source = "data_volume"
  destination = "/data"

[services]
  [[services]]
    internal_port = 3000
    protocol = "tcp"
    auto_stop_machines = "stop"
    auto_start_machines = true
    min_machines_running = 0

    [services.concurrency]
      type = "connections"
      hard_limit = 20
      soft_limit = 10